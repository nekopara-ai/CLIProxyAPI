name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect internal/translator changes
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            internal/translator/**
      - name: Fail when restricted paths change
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A release sync may also carry existing fork edits through a clean merge.
          if [[ "$REPOSITORY" == 'nekopara-ai/CLIProxyAPI' &&
                "$HEAD_REPOSITORY" == "$REPOSITORY" &&
                "$BASE_REF" == 'codex/cpa-transport-effective-tier' ]]; then
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor origin/main "$HEAD_SHA"
            ancestor=$(git merge-base "$BASE_SHA" origin/main)
            work=$(mktemp -d)
            trap 'rm -rf -- "$work"' EXIT
            export GIT_LITERAL_PATHSPECS=1
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" -- internal/translator > "$work/paths"
            while IFS= read -r -d '' path; do
              if git diff --quiet origin/main "$HEAD_SHA" -- "$path"; then
                continue
              fi
              mode=$(git ls-tree --format='%(objectmode)' "$ancestor" -- "$path")
              [[ "$mode" == 100644 || "$mode" == 100755 ]]
              for revision in "$BASE_SHA" origin/main "$HEAD_SHA"; do
                [[ "$(git ls-tree --format='%(objectmode)' "$revision" -- "$path")" == "$mode" ]]
              done
              git cat-file blob "$ancestor:$path" > "$work/ancestor"
              git cat-file blob "$BASE_SHA:$path" > "$work/fork"
              git cat-file blob "origin/main:$path" > "$work/upstream"
              git cat-file blob "$HEAD_SHA:$path" > "$work/head"
              if cmp -s "$work/ancestor" "$work/fork" || cmp -s "$work/ancestor" "$work/upstream" ||
                 ! git merge-file -p "$work/fork" "$work/ancestor" "$work/upstream" > "$work/merged" ||
                 ! cmp -s "$work/merged" "$work/head"; then
                echo "::error::Translator changes must reproduce the clean three-way merge"
                exit 1
              fi
            done < "$work/paths"
            echo "Verified translator changes against upstream and the existing fork."
            exit 0
          fi
          echo "Changes under internal/translator are not allowed in pull requests."
          echo "You need to create an issue for our maintenance team to make the necessary changes."
          exit 1
