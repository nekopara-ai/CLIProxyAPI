name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect internal/translator changes
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            internal/translator/**
      - name: Fail when restricted paths change
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A release sync may import upstream files verbatim, never arbitrary edits.
          if [[ "$REPOSITORY" == 'nekopara-ai/CLIProxyAPI' &&
                "$HEAD_REPOSITORY" == "$REPOSITORY" &&
                "$BASE_REF" == 'codex/cpa-transport-effective-tier' ]]; then
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor origin/main "$HEAD_SHA"
            while IFS= read -r -d '' path; do
              if ! git diff --quiet origin/main "$HEAD_SHA" -- "$path"; then
                echo "::error file=$path::Translator changes must match synchronized main exactly"
                exit 1
              fi
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- internal/translator)
            echo "Translator changes are verbatim upstream synchronization."
            exit 0
          fi
          echo "Changes under internal/translator are not allowed in pull requests."
          echo "You need to create an issue for our maintenance team to make the necessary changes."
          exit 1
