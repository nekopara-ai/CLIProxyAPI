name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify patched release ancestry
        if: github.base_ref == 'codex/cpa-transport-effective-tier'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Patched release PR must merge current origin/main before publication"
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Test patched release integration
        if: github.base_ref == 'codex/cpa-transport-effective-tier'
        run: go test ./... -count=1 -timeout=240s
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
