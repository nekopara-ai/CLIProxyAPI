name: sync-upstream-main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-upstream-main.yml
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nekopara-ai/CLIProxyAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main
