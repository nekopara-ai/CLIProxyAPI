name: mint-rewrite-workbench

on:
  push:
    branches: [codex/cpa-gateway-mint-reviewed-20260924]
    paths: [.dev/mint-rewrite.patch]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'nekopara-ai/CLIProxyAPI' && github.ref == 'refs/heads/codex/cpa-gateway-mint-reviewed-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cpa-gateway-mint-reviewed-20260924
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply fixture correction and remove temporary workbench
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .dev/mint-rewrite.patch
          git apply --index .dev/mint-rewrite.patch
          git diff --cached --name-only -- '*.go' | xargs -r gofmt -w
          rm .dev/mint-rewrite.patch .github/workflows/mint-rewrite-workbench.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(codex): correct cancellation fixtures and remove temporary workbench'
          git push origin HEAD:refs/heads/codex/cpa-gateway-mint-reviewed-20260924
          git rev-parse HEAD > /tmp/mint-tested-sha.txt
          git archive --format=tar HEAD > /tmp/mint-source.tar
      - name: Full repository tests
        run: go test ./... -count=1 -timeout=120s > /tmp/mint-test.log 2>&1
      - name: New core race tests
        if: always()
        run: go test -race ./internal/runtime/executor/helps/codexmint -count=1 -timeout=60s > /tmp/mint-race-core.log 2>&1
      - name: Acquisition and injection integration race tests
        if: always()
        run: go test -race ./internal/runtime/executor/helps -run '^TestGateway' -count=1 -timeout=60s > /tmp/mint-race-integration.log 2>&1
      - name: Server build
        if: always()
        run: go build -o /tmp/mint-test-server ./cmd/server > /tmp/mint-build.log 2>&1
      - name: Upload source and all verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mint-rewrite-final-review
          path: |
            /tmp/mint-source.tar
            /tmp/mint-tested-sha.txt
            /tmp/mint-test.log
            /tmp/mint-build.log
            /tmp/mint-race-core.log
            /tmp/mint-race-integration.log
          retention-days: 2
